server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vue Router history 模式：找不到文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 前端 baseURL 为 /api，后端 context-path 也是 /api
    # 这里不裁剪 URI，原样转发 /api/xxx -> backend:9199/api/xxx
    location /api/ {
        proxy_pass http://backend:9199;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 同源转发 Cookie，Spring Session 登录态才能生效
        proxy_set_header Cookie $http_cookie;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # 允许长连接与较大请求体（点赞接口为小 JSON，留出余量）
    client_max_body_size 10m;
}
